name: CI/CD Pipeline

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

permissions:
  contents: write # Required for deploying to the gh-pages branch

env:
  # CI does not launch Electron; skip the ~100 MB binary download.
  ELECTRON_SKIP_BINARY_DOWNLOAD: '1'

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci --legacy-peer-deps

      - name: Install UI Dependencies
        run: npm ci --prefix ui --legacy-peer-deps

      - name: Build Project
        run: npm run build

      - name: Run Verification Tests
        run: npm test

      - name: Build and Test UI
        run: npm run ui:build && npm --prefix ui test -- --run

      - name: Install Playwright Browser
        run: npx playwright install --with-deps chromium

      - name: Run Browser E2E Tests
        run: npm run test-browser-e2e

  deploy-docs:
    needs: build-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci --legacy-peer-deps

      - name: Generate API Documentation
        run: npm run docs

      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: docs
          target-folder: docs
          branch: gh-pages # The branch the action should deploy to.
